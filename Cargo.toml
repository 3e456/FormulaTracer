[workspace]
resolver = "2"
members = [
  "rust/formulatracer-core",
  "rust/formulatracer-c-api",
  "rust/formulatracer-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/3e456/FormulaTracer"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
