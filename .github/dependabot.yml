version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: monthly}
    groups:
      python-maintenance:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: monthly}
    groups:
      rust-maintenance:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions-maintenance:
        patterns: ["*"]
    open-pull-requests-limit: 2
