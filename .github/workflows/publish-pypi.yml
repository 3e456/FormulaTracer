name: Publish verified release to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact verified GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.release_tag }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/formulatracer
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          test "${RELEASE_TAG}" = "v${VERSION}"
          mkdir -p dist/evidence dist/pypi
          gh release download "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --dir dist/evidence
          (cd dist/evidence && sha256sum --check SHA256SUMS)
          cp "dist/evidence/formulatracer-${VERSION}-py3-none-win_amd64.whl" dist/pypi/
          cp "dist/evidence/formulatracer-${VERSION}.tar.gz" dist/pypi/

      - name: Repair and validate the Linux wheel for PyPI
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 -m pip install --disable-pip-version-check \
            "auditwheel==6.4.2" "wheel==0.45.1"
          python3 -m wheel unpack \
            "dist/evidence/formulatracer-${VERSION}-py3-none-linux_x86_64.whl" \
            --dest dist/unpacked
          test -d "dist/unpacked/formulatracer-${VERSION}/formulatracer-${VERSION}.data/purelib"
          cp -a \
            "dist/unpacked/formulatracer-${VERSION}/formulatracer-${VERSION}.data/purelib/." \
            "dist/unpacked/formulatracer-${VERSION}/"
          rm -r "dist/unpacked/formulatracer-${VERSION}/formulatracer-${VERSION}.data/purelib"
          rmdir "dist/unpacked/formulatracer-${VERSION}/formulatracer-${VERSION}.data"
          mkdir -p dist/normalized
          python3 -m wheel pack \
            "dist/unpacked/formulatracer-${VERSION}" \
            --dest-dir dist/normalized
          python3 -m auditwheel show \
            "dist/normalized/formulatracer-${VERSION}-py3-none-linux_x86_64.whl"
          python3 -m auditwheel repair \
            --wheel-dir dist/pypi \
            "dist/normalized/formulatracer-${VERSION}-py3-none-linux_x86_64.whl"
          python3 -m venv .pypi-linux-smoke
          .pypi-linux-smoke/bin/python -m pip install --disable-pip-version-check \
            dist/pypi/formulatracer-${VERSION}-py3-none-manylinux*_x86_64.whl
          .pypi-linux-smoke/bin/python - <<'PY'
          import formulatracer

          assert formulatracer.native_available()
          print("repaired Linux wheel smoke: PASS")
          PY

      - name: Publish distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/pypi
