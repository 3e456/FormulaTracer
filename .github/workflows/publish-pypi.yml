name: Publish verified release to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish v0.1.0
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/formulatracer
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/evidence dist/pypi
          gh release download v0.1.0 \
            --repo "${{ github.repository }}" \
            --dir dist/evidence
          (cd dist/evidence && sha256sum --check SHA256SUMS)
          cp dist/evidence/formulatracer-0.1.0-py3-none-win_amd64.whl dist/pypi/
          cp dist/evidence/formulatracer-0.1.0.tar.gz dist/pypi/

      - name: Repair and validate the Linux wheel for PyPI
        run: |
          python3 -m pip install --disable-pip-version-check \
            "auditwheel==6.4.2" "wheel==0.45.1"
          python3 -m wheel unpack \
            dist/evidence/formulatracer-0.1.0-py3-none-linux_x86_64.whl \
            --dest dist/unpacked
          test -d dist/unpacked/formulatracer-0.1.0/formulatracer-0.1.0.data/purelib
          cp -a \
            dist/unpacked/formulatracer-0.1.0/formulatracer-0.1.0.data/purelib/. \
            dist/unpacked/formulatracer-0.1.0/
          rm -r dist/unpacked/formulatracer-0.1.0/formulatracer-0.1.0.data/purelib
          rmdir dist/unpacked/formulatracer-0.1.0/formulatracer-0.1.0.data
          mkdir -p dist/normalized
          python3 -m wheel pack \
            dist/unpacked/formulatracer-0.1.0 \
            --dest-dir dist/normalized
          python3 -m auditwheel show \
            dist/normalized/formulatracer-0.1.0-py3-none-linux_x86_64.whl
          python3 -m auditwheel repair \
            --wheel-dir dist/pypi \
            dist/normalized/formulatracer-0.1.0-py3-none-linux_x86_64.whl
          python3 -m venv .pypi-linux-smoke
          .pypi-linux-smoke/bin/python -m pip install --disable-pip-version-check \
            dist/pypi/formulatracer-0.1.0-py3-none-manylinux*_x86_64.whl
          .pypi-linux-smoke/bin/python - <<'PY'
          import formulatracer

          assert formulatracer.native_available()
          print("repaired Linux wheel smoke: PASS")
          PY

      - name: Publish distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/pypi
