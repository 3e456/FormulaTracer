name: Scheduled maintenance audit

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-provider-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements/ci.txt -e .
      - run: cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
      - run: python tools/public_release_audit.py
      - run: python tools/check_maintenance.py
      - name: Explain non-blocking scope
        run: echo "Scheduled network/upstream drift does not block ordinary pull requests; review failures manually."
