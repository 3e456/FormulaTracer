name: Tier 3 - Release validation (no publish)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/prepublic-final-integration-assurance

permissions:
  contents: read

env:
  FORMULATRACER_RELEASE_VERSION: "0.1.1"
  FORMULATRACER_REFERENCE_ACCESS_DATE: "2026-08-29"

jobs:
  full-semantic-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "."
      - run: python -m pip install -r requirements/ci.txt -e .
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: lake build CppAudit
      - run: python -m pytest -q
      - run: python tools/run_native_differential.py
      - run: python tools/run_structural_isomorphism_assurance.py
      - run: python scripts/run_final_native_assurance.py
      - run: python tools/check_maintenance.py --operational
      - run: python tools/public_release_audit.py
      - run: python scripts/run_prepublic_semantic_upgrade.py all
      - run: python tools/prepublic_release_hardening.py
      - name: Public provider runtime self-audit
        run: |
          python -m pip install numpy pandas xarray "dask[array]" scipy
          python tools/prepublic_provider_runtime_fixtures.py
      - run: >-
          git diff --exit-code -- output/public_docs
          output/public_release_audit/provider-upstream-conformance.json
          output/public_release_audit/library-conformance-summary.json

  lean-proof-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "."
      - run: lake build CppAudit
      - run: '! grep -R -E "\b(sorry|admit|axiom)\b" lean --include="*.lean"'

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements/ci.txt
      - run: python tools/build_release.py --kind all
      - if: runner.os == 'Linux'
        name: Clean-install Linux wheel and record environment
        run: |
          python -m venv .linux-wheel-smoke
          .linux-wheel-smoke/bin/python -m pip install --upgrade pip
          .linux-wheel-smoke/bin/python -m pip install dist/release/*.whl
          .linux-wheel-smoke/bin/python tools/linux_wheel_smoke.py
          python tools/linux_release_evidence.py --smoke-passed
      - if: runner.os == 'Linux'
        name: Produce and validate the final manylinux wheel
        run: |
          VERSION="${FORMULATRACER_RELEASE_VERSION}"
          python -m pip install --disable-pip-version-check \
            "auditwheel==6.4.2" "wheel==0.45.1"
          python -m wheel unpack \
            "dist/release/formulatracer-${VERSION}-py3-none-linux_x86_64.whl" \
            --dest dist/unpacked
          test -d "dist/unpacked/formulatracer-${VERSION}/formulatracer-${VERSION}.data/purelib"
          cp -a \
            "dist/unpacked/formulatracer-${VERSION}/formulatracer-${VERSION}.data/purelib/." \
            "dist/unpacked/formulatracer-${VERSION}/"
          rm -r "dist/unpacked/formulatracer-${VERSION}/formulatracer-${VERSION}.data/purelib"
          rmdir "dist/unpacked/formulatracer-${VERSION}/formulatracer-${VERSION}.data"
          mkdir -p dist/normalized dist/final
          python -m wheel pack \
            "dist/unpacked/formulatracer-${VERSION}" \
            --dest-dir dist/normalized
          python -m auditwheel show \
            "dist/normalized/formulatracer-${VERSION}-py3-none-linux_x86_64.whl"
          python -m auditwheel repair \
            --wheel-dir dist/final \
            "dist/normalized/formulatracer-${VERSION}-py3-none-linux_x86_64.whl"
          python -m auditwheel show dist/final/formulatracer-${VERSION}-py3-none-manylinux*_x86_64.whl
          python -m venv .manylinux-wheel-smoke
          .manylinux-wheel-smoke/bin/python -m pip install --disable-pip-version-check \
            dist/final/formulatracer-${VERSION}-py3-none-manylinux*_x86_64.whl
          .manylinux-wheel-smoke/bin/python tools/linux_wheel_smoke.py
          rm "dist/release/formulatracer-${VERSION}-py3-none-linux_x86_64.whl"
          cp dist/final/formulatracer-${VERSION}-py3-none-manylinux*_x86_64.whl dist/release/
          python tools/artifact_manifest.py \
            dist/release/*.whl dist/release/*.tar.gz \
            --output dist/release/release-manifest.json
      - run: python tools/repository_sanitization_scan.py --scope both --summary-only --fail-on-hit --archive dist/release/formulatracer-${{ env.FORMULATRACER_RELEASE_VERSION }}.tar.gz
      - if: runner.os == 'Windows'
        run: python tools/repository_sanitization_scan.py --scope current --summary-only --fail-on-hit --archive dist/release/formulatracer-${{ env.FORMULATRACER_RELEASE_VERSION }}-py3-none-win_amd64.whl
      - if: runner.os == 'Linux'
        run: python tools/repository_sanitization_scan.py --scope current --summary-only --fail-on-hit --archive dist/release/formulatracer-${{ env.FORMULATRACER_RELEASE_VERSION }}-py3-none-manylinux*_x86_64.whl
      - uses: actions/upload-artifact@v7
        with:
          name: verified-artifacts-${{ runner.os }}
          path: dist/release/
          retention-days: 14
